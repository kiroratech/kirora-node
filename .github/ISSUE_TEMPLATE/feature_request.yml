name: Feature request
description: Suggest an improvement or new feature.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. We read every request, but can't promise to build them all.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem you're solving, not just the feature you'd like.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like the SDK to do?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: How are you working around it today?
