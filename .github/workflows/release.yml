name: Release

# Publishes package.json's version when it isn't on npm yet: after a merge that bumps it,
# or when a matching v* tag is pushed. Either can come first; the other then does nothing.
# scripts/release-plan.mjs decides whether to publish, and under which dist-tag.
# Bump the version in src/core/version.ts too; a test fails if it doesn't match.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  # Lets npm authenticate with GitHub's OIDC token (trusted publishing), so no npm token
  # is stored here.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships with.
          node-version: 24
          # No cache: a cache another workflow wrote could change what gets published.
          registry-url: https://registry.npmjs.org
      - name: Decide whether and where to publish
        id: plan
        # Fails if the tag doesn't match package.json, or npm can't be reached.
        run: node scripts/release-plan.mjs
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm typecheck
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm codegen:check
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm test
      # Pack once, check that tarball as a consumer would, then publish the same file.
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm pack --pack-destination release
      - if: steps.plan.outputs.publish == 'true'
        run: pnpm check:package release/*.tgz
      - if: steps.plan.outputs.publish == 'true'
        run: npm publish ./release/*.tgz --tag ${{ steps.plan.outputs.dist-tag }}
